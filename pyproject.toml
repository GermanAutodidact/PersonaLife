[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalife"
version = "1.1.0"
description = "Persistent life simulation for AI characters / Fortlaufende Lebenssimulation für KI-Charaktere"
classifiers = ["Natural Language :: English", "Natural Language :: German"]
keywords = ["ai-characters", "llm", "npc", "life-simulation", "persistent-memory", "local-first"]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.urls]
Repository = "https://github.com/GermanAutodidact/PersonaLife"
"Dokumentation (Deutsch)" = "https://github.com/GermanAutodidact/PersonaLife/blob/main/README.de.md"
Documentation = "https://github.com/GermanAutodidact/PersonaLife/blob/main/README.md"
Issues = "https://github.com/GermanAutodidact/PersonaLife/issues"

[project.scripts]
personalife = "personalife.cli:main"

[tool.setuptools.packages.find]
include = ["personalife*"]
